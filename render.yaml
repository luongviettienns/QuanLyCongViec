databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: taskflow-demo
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    buildCommand: >-
      npm ci --include=dev &&
      npx prisma generate --schema=apps/backend/prisma/schema.prisma &&
      npm run build:shared &&
      npm run build:backend &&
      npm run build:frontend
    startCommand: >-
      npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma &&
      node apps/backend/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24.19.0'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: FRONTEND_DIST_DIR
        value: apps/frontend/dist
      - key: VITE_API_BASE_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: INTERNAL_API_KEY
        generateValue: true
