databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free

services:
  - type: web
    name: taskflow-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate --schema=apps/backend/prisma/schema.prisma && npm run build:shared && npm run build:backend && npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
